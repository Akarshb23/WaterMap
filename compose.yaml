services:
  backend:
    build:
      context : ./backend
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    env_file:
    - path : ./backend/.env
      required: false
    volumes:
      - ./backend/watermap.db:/app/watermap.db
    restart : unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped